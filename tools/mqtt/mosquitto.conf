# Mosquitto broker for the PicoCar (started by tools/mqtt/start_broker.sh).
# Listens on every interface so the car can reach it over the phone
# hotspot.  No password: run it only on a network you control, and stop
# it (Ctrl-C in start_broker.sh) when you are done.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
